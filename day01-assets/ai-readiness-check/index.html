<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>나의 AI 활용 준비도</title>
  <style>
    :root{--ink:#17242c;--muted:#66747c;--paper:#fffdf8;--line:#ded9cf;--orange:#ff6b42;--navy:#17384a;--soft:#fff0e9}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(145deg,#edf6f4,#fff3ea);font-family:Pretendard,"Apple SD Gothic Neo",sans-serif;color:var(--ink)}
    .app{width:min(100%,560px);min-height:650px;padding:30px;border:1px solid rgba(23,56,74,.14);border-radius:28px;background:var(--paper);box-shadow:0 24px 70px rgba(23,56,74,.16)}
    .eyebrow{margin:0;color:var(--orange);font-size:14px;font-weight:900;letter-spacing:.08em}.title{margin:8px 0 10px;font-size:34px;line-height:1.25;letter-spacing:-.04em}.desc{margin:0;color:var(--muted);line-height:1.65}.hero{display:grid;place-items:center;height:220px;margin:24px 0;border-radius:22px;background:radial-gradient(circle at 30% 20%,#ffd5c7,transparent 35%),linear-gradient(135deg,#17384a,#245c70);color:white;text-align:center}.hero strong{font-size:64px}.hero span{display:block;font-weight:800}.button{width:100%;min-height:56px;border:0;border-radius:15px;background:var(--orange);color:white;font-size:18px;font-weight:900;cursor:pointer}.button:hover{filter:brightness(.95)}.button.secondary{margin-top:10px;background:white;color:var(--navy);border:1px solid var(--line)}
    .progress{height:10px;margin:20px 0 28px;border-radius:999px;background:#ece8df;overflow:hidden}.progress>div{height:100%;background:var(--orange);transition:width .25s}.count{color:var(--muted);font-size:14px}.question{min-height:88px;margin:9px 0 20px;font-size:25px;line-height:1.45;letter-spacing:-.02em}.answers{display:grid;gap:10px}.answer{min-height:58px;padding:12px 15px;border:1px solid var(--line);border-radius:14px;background:white;color:var(--ink);text-align:left;font-size:16px;cursor:pointer}.answer:hover,.answer:focus{border-color:var(--orange);background:var(--soft);outline:3px solid rgba(255,107,66,.13)}
    .result-badge{display:inline-block;padding:7px 12px;border-radius:999px;background:var(--soft);color:#b83e20;font-weight:900}.result-title{margin:16px 0 8px;font-size:36px;letter-spacing:-.04em}.score{color:var(--muted)}.result-box{margin:22px 0;padding:20px;border-radius:18px;background:#eef6f7;line-height:1.7}.steps{padding-left:22px;line-height:1.8}.privacy{margin:20px 0 0;color:var(--muted);font-size:13px;text-align:center}.hidden{display:none}
    @media(max-width:520px){body{padding:0}.app{min-height:100vh;padding:26px 20px;border-radius:0}.title{font-size:30px}.question{font-size:22px}}
  </style>
</head>
<body>
  <main class="app" aria-live="polite">
    <section id="start">
      <p class="eyebrow">AI 왕초보 챌린지 · DAY 1</p>
      <h1 class="title">나의 AI 활용 준비도는?</h1>
      <p class="desc">5개 질문에 답하면 지금 나에게 맞는 첫 행동을 알려드립니다. 정답은 없습니다.</p>
      <div class="hero"><div><strong>5</strong><span>개의 쉬운 질문</span></div></div>
      <button class="button" id="startButton">진단 시작하기</button>
      <p class="privacy">이름·전화번호·이메일을 받거나 저장하지 않습니다.</p>
    </section>

    <section id="quiz" class="hidden">
      <span class="count" id="count"></span>
      <div class="progress"><div id="progress"></div></div>
      <h2 class="question" id="question"></h2>
      <div class="answers" id="answers"></div>
    </section>

    <section id="result" class="hidden">
      <span class="result-badge">진단 완료</span>
      <h2 class="result-title" id="resultTitle"></h2>
      <p class="score" id="resultScore"></p>
      <div class="result-box" id="resultDescription"></div>
      <h3>오늘 바로 할 일</h3>
      <ol class="steps" id="resultSteps"></ol>
      <button class="button" id="copyButton">결과 한 줄 복사하기</button>
      <button class="button secondary" id="restartButton">다시 진단하기</button>
    </section>
  </main>

  <script>
    const questions=[
      {q:"AI에게 일을 부탁해 본 적이 있나요?",a:[["아직 한 번도 없어요",0],["질문 몇 번은 해봤어요",1],["글이나 자료를 만들어봤어요",2],["반복 작업에도 사용해요",3]]},
      {q:"AI 답변이 마음에 들지 않을 때 어떻게 하나요?",a:[["그냥 포기해요",0],["같은 질문을 다시 해요",1],["원하는 부분을 구체적으로 고쳐 달라고 해요",2],["기준과 예시를 주고 검수해요",3]]},
      {q:"내 자료를 AI에게 활용시켜 본 적이 있나요?",a:[["없어요",0],["글을 붙여넣어 봤어요",1],["파일을 올려 결과를 만들었어요",2],["프로젝트로 자료와 규칙을 관리해요",3]]},
      {q:"AI가 만든 결과물을 실제로 사용해 봤나요?",a:[["아직 없어요",0],["개인 메모로만 써봤어요",1],["글·이미지·문서를 공유했어요",2],["도구나 자동화로 반복 사용해요",3]]},
      {q:"지금 가장 배우고 싶은 것은 무엇인가요?",a:[["AI와 편하게 대화하기",0],["내 자료 정리하기",1],["콘텐츠와 디자인 만들기",2],["반복 업무 자동화하기",3]]}
    ];
    const levels=[
      {max:3,title:"첫 인사 단계",desc:"지금은 기능을 많이 아는 것보다 AI에게 작은 부탁 하나를 끝까지 해보는 것이 중요합니다.",steps:["오늘 할 일 하나를 문장으로 부탁하기","답변에서 한 부분만 다시 고쳐 달라고 하기","고친 결과를 한 사람에게 보여주기"]},
      {max:7,title:"생활 활용 단계",desc:"질문은 해봤지만 결과를 실제 일에 연결하는 연습이 필요합니다. 자주 하는 일 하나를 골라보세요.",steps:["반복해서 쓰는 안내문 하나 고르기","내 상황과 대상을 함께 설명하기","완성 결과를 파일로 저장하기"]},
      {max:11,title:"콘텐츠 제작 단계",desc:"AI로 결과물을 만들 준비가 됐습니다. 이제 내 기준을 저장하고 같은 품질로 반복하는 연습이 필요합니다.",steps:["좋은 예시와 내 기준을 함께 주기","결과물을 직접 검수하고 수정하기","내 말투와 금칙어를 프로젝트에 저장하기"]},
      {max:15,title:"자동화 준비 단계",desc:"이미 AI를 실제 작업에 쓰고 있습니다. 입력·순서·완료 조건을 정리하면 반복 업무를 자동화할 수 있습니다.",steps:["반복 작업의 입력과 출력을 적기","성공한 작업 순서를 Skill로 저장하기","작은 자동화부터 검사하며 실행하기"]}
    ];
    let index=0,score=0,currentResult;
    const start=document.querySelector('#start'),quiz=document.querySelector('#quiz'),result=document.querySelector('#result');
    document.querySelector('#startButton').onclick=()=>{start.classList.add('hidden');quiz.classList.remove('hidden');renderQuestion()};
    function renderQuestion(){const item=questions[index];document.querySelector('#count').textContent=`${index+1} / ${questions.length}`;document.querySelector('#progress').style.width=`${(index/questions.length)*100}%`;document.querySelector('#question').textContent=item.q;const box=document.querySelector('#answers');box.innerHTML='';item.a.forEach(([label,value])=>{const b=document.createElement('button');b.className='answer';b.textContent=label;b.onclick=()=>{score+=value;index++;index<questions.length?renderQuestion():showResult()};box.appendChild(b)})}
    function showResult(){quiz.classList.add('hidden');result.classList.remove('hidden');currentResult=levels.find(x=>score<=x.max);document.querySelector('#resultTitle').textContent=currentResult.title;document.querySelector('#resultScore').textContent=`준비도 점수 ${score} / 15`;document.querySelector('#resultDescription').textContent=currentResult.desc;document.querySelector('#resultSteps').innerHTML=currentResult.steps.map(x=>`<li>${x}</li>`).join('')}
    document.querySelector('#restartButton').onclick=()=>{index=0;score=0;result.classList.add('hidden');start.classList.remove('hidden')};
    document.querySelector('#copyButton').onclick=async()=>{const text=`나의 AI 활용 준비도: ${currentResult.title} (${score}/15) — 오늘 할 일: ${currentResult.steps[0]}`;try{await navigator.clipboard.writeText(text);document.querySelector('#copyButton').textContent='복사했습니다 ✓';setTimeout(()=>document.querySelector('#copyButton').textContent='결과 한 줄 복사하기',1400)}catch{alert(text)}};
  </script>
</body>
</html>
