<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Caption Atelier — 인스타 콘텐츠 스튜디오</title>
  <style>
    :root{--ink:#1c1820;--paper:#f6f1e8;--line:#ddd3c5;--coral:#ff654d;--purple:#6e56cf;--green:#176b52}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif;background:var(--paper);min-height:100vh}button,input,textarea{font:inherit}.app{display:grid;grid-template-columns:390px 1fr;min-height:100vh}.side{padding:28px;background:#1b1820;color:white;position:relative;overflow:hidden}.side:after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:#ff654d55;filter:blur(60px);right:-120px;bottom:-80px}.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:15px;letter-spacing:.08em}.brand i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--coral);font-style:normal}.side h1{font-family:Georgia,"Times New Roman",serif;font-weight:500;font-size:43px;line-height:.97;letter-spacing:-.045em;margin:58px 0 15px}.side h1 em{color:#ff9c8d}.side>p{color:#bbb4c2;line-height:1.6;font-size:14px;margin-bottom:30px}.form{position:relative;z-index:1}.field{margin-bottom:16px}.field label{display:block;font-size:12px;color:#aaa4b1;margin-bottom:7px;font-weight:700}.field input,.field textarea{width:100%;border:1px solid #48414e;border-radius:12px;background:#28232c;color:white;padding:12px 13px;outline:none}.field input:focus,.field textarea:focus{border-color:#ff9c8d;box-shadow:0 0 0 3px #ff654d22}.field textarea{height:68px;resize:vertical}.upload{border:1px dashed #625968;border-radius:14px;padding:13px;display:flex;align-items:center;gap:11px;cursor:pointer;margin-bottom:16px;background:#252129}.thumb{width:48px;height:48px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,#ffb19f,#7c5cff);font-size:21px;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}.upload b{display:block;font-size:13px}.upload span{font-size:11px;color:#aaa4b1}.tones{display:flex;gap:7px;flex-wrap:wrap}.tone{border:1px solid #4d4653;background:#28232c;color:#bbb4c2;border-radius:99px;padding:8px 11px;cursor:pointer;font-size:12px}.tone.active{background:#fff;color:#1b1820;border-color:#fff;font-weight:800}.generate{width:100%;margin-top:20px;padding:14px;border:0;border-radius:13px;background:linear-gradient(135deg,var(--coral),#ff9f5a);color:#fff;font-weight:900;cursor:pointer;box-shadow:0 13px 30px #ff654d33}.main{padding:34px clamp(22px,4vw,58px)}.top{display:flex;justify-content:space-between;align-items:center}.kicker{color:var(--coral);font-weight:900;font-size:12px;letter-spacing:.1em}.top h2{font-size:29px;letter-spacing:-.04em;margin:6px 0}.count{font-family:Georgia,serif;font-size:50px;color:#d9cec0}.preview-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:28px}.result{background:#fff;border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 16px 40px #46382910;transition:.25s}.result:hover{transform:translateY(-4px);box-shadow:0 22px 55px #46382922}.post{aspect-ratio:1/1;background:linear-gradient(145deg,#f4c0ad,#725fc9);padding:20px;position:relative;overflow:hidden;color:white;display:flex;flex-direction:column;justify-content:space-between}.post:after{content:"";position:absolute;width:190px;height:190px;border-radius:50%;right:-50px;top:-40px;border:42px solid #ffffff22}.post small{position:relative;z-index:1;font-weight:800;letter-spacing:.08em}.post h3{position:relative;z-index:1;font-family:Georgia,serif;font-size:clamp(25px,3vw,39px);line-height:.95;margin:0;letter-spacing:-.04em}.post h3 span{display:block;font-family:inherit;font-size:.48em;margin-top:12px;color:#fff8}.caption{padding:18px}.badge{display:inline-flex;padding:6px 9px;border-radius:99px;background:#f6efe7;color:#6f5e4f;font-size:11px;font-weight:900}.hook{font-size:15px;font-weight:900;line-height:1.45;margin:13px 0 10px}.bodycopy{font-size:12px;color:#615a62;line-height:1.65;min-height:82px}.tags{font-size:11px;color:var(--purple);line-height:1.6}.copy{width:100%;margin-top:14px;border:1px solid var(--ink);border-radius:10px;background:white;padding:10px;font-weight:900;cursor:pointer}.copy.done{background:var(--green);color:white;border-color:var(--green)}.tip{margin-top:24px;padding:18px 20px;border-left:4px solid var(--coral);background:#fff7ef;color:#665850;font-size:13px;line-height:1.6}.spark{animation:spark .55s ease}@keyframes spark{from{opacity:.15;transform:scale(.97)}to{opacity:1;transform:scale(1)}}
    @media(max-width:1050px){.app{grid-template-columns:340px 1fr}.preview-grid{grid-template-columns:1fr 1fr}.result:last-child{grid-column:1/-1;max-width:360px}}@media(max-width:760px){.app{display:block}.side{padding:22px}.side h1{font-size:35px;margin-top:32px}.main{padding:25px 16px}.preview-grid{grid-template-columns:1fr}.result:last-child{grid-column:auto;max-width:none}.post{aspect-ratio:4/3}.count{display:none}}
  </style>
</head>
<body><main class="app">
  <aside class="side"><div class="brand"><i>✦</i> CAPTION ATELIER</div><h1>한 장의 사진을<br><em>세 가지 목소리</em>로.</h1><p>제품과 고객만 알려 주세요. 같은 소재를 친근함·전문성·스토리텔링 캡션으로 펼칩니다.</p>
    <div class="form"><label class="upload" for="image"><span class="thumb" id="thumb">＋</span><span><b>제품 사진 올리기</b><span>클릭해서 JPG·PNG 선택</span></span></label><input id="image" type="file" accept="image/*" hidden>
      <div class="field"><label for="name">제품 또는 콘텐츠 이름</label><input id="name" value="저녁 20분 주방 리셋"></div>
      <div class="field"><label for="benefit">가장 큰 장점</label><textarea id="benefit">집 전체가 아니라 식탁 한 칸부터 비우고 저녁 시간을 되찾는다</textarea></div>
      <div class="field"><label for="audience">누구에게</label><input id="audience" value="육아와 집안일로 저녁이면 지친 부모"></div>
      <div class="field"><label>브랜드 분위기</label><div class="tones"><button class="tone active">따뜻함</button><button class="tone">대담함</button><button class="tone">차분함</button></div></div>
      <button class="generate" id="generate">✦ 캡션 3종 만들기</button>
    </div>
  </aside>
  <section class="main"><div class="top"><div><div class="kicker">READY TO POST</div><h2>오늘 바로 올릴 캡션 3종</h2></div><div class="count">03</div></div><div class="preview-grid" id="results"></div><div class="tip"><b>한 번 만든 뒤 이렇게 발전시켜 보세요.</b><br>“첫 문장을 더 강하게”, “내 경험 한 줄 추가”, “해시태그는 5개만”처럼 한 부분씩 말하면 같은 아티팩트가 점점 내 브랜드에 가까워집니다.</div></section>
  <script>
    const types=[
      {name:'FRIENDLY',label:'친근하게',sub:'오늘의 작은 시작',hook:n=>`“${n}, 오늘도 미뤄도 될까요?”`,body:(n,b,a)=>`지친 마음, 정말 자연스러워요. ${b}. ${a}도 오늘 한 칸부터 가볍게 시작해요.`,tags:'#20분리셋 #저녁루틴 #오늘한칸',grad:'linear-gradient(145deg,#ffb4a2,#ff6b6b)'},
      {name:'GUIDE',label:'정보형으로',sub:'20-MINUTE RESET',hook:n=>`${n}, 의지보다 순서가 먼저입니다.`,body:(n,b,a)=>`${b}. ${a}을 위해 모으기·나누기·멈추기의 세 단계로 정리했습니다.`,tags:'#생활루틴 #주방정리 #작게시작',grad:'linear-gradient(145deg,#5063d9,#151c4a)'},
      {name:'STORY',label:'스토리로',sub:'작은 성공의 기록',hook:n=>`어젯밤, 식탁 앞에서 그대로 멈췄습니다.`,body:(n,b,a)=>`하지만 ${n}을 20분만 해보니 아침이 달라졌습니다. ${b}. ${a}의 오늘도 한 칸이면 충분합니다.`,tags:'#현실살림 #저녁의틈 #다시시작',grad:'linear-gradient(145deg,#23655a,#d3a25a)'}
    ];
    const nameInput=document.getElementById('name'),benefitInput=document.getElementById('benefit'),audienceInput=document.getElementById('audience'),resultsBox=document.getElementById('results'),generateButton=document.getElementById('generate'),imageInput=document.getElementById('image'),thumbBox=document.getElementById('thumb');
    let selectedTone='따뜻함',imageUrl='';
    const toneLead={따뜻함:'부담 없이 함께 시작하는',대담함:'오늘 바로 움직이게 하는',차분함:'순서를 천천히 짚어 주는'};
    const escapeHTML=value=>value.replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    function render(){const rawName=nameInput.value.trim()||'나의 콘텐츠',rawBenefit=benefitInput.value.trim()||'한 걸음씩 결과를 완성한다',rawAudience=audienceInput.value.trim()||'새롭게 시작하는 사람',n=escapeHTML(rawName),b=escapeHTML(rawBenefit),a=escapeHTML(rawAudience),tone=escapeHTML(toneLead[selectedTone]);resultsBox.classList.remove('spark');void resultsBox.offsetWidth;resultsBox.classList.add('spark');resultsBox.innerHTML=types.map((x,i)=>{const background=imageUrl?`linear-gradient(0deg,#19141acc,#19141a22),url('${imageUrl}') center/cover`:x.grad;return `<article class="result"><div class="post" style="background:${background}"><small>${x.name} / 0${i+1}</small><h3>${n}<span>${x.sub}</span></h3></div><div class="caption"><span class="badge">${x.label} · ${selectedTone}</span><div class="hook">${x.hook(n)}</div><div class="bodycopy">${tone} 분위기로 씁니다. ${x.body(n,b,a)}</div><div class="tags">${x.tags}</div><button class="copy">캡션 복사</button></div></article>`}).join('');document.querySelectorAll('.copy').forEach(btn=>btn.onclick=async()=>{const card=btn.closest('.caption');await navigator.clipboard?.writeText(card.innerText.replace('캡션 복사',''));btn.textContent='✓ 복사했어요';btn.classList.add('done');setTimeout(()=>{btn.textContent='캡션 복사';btn.classList.remove('done')},1500)})}
    document.querySelectorAll('.tone').forEach(x=>x.onclick=()=>{document.querySelectorAll('.tone').forEach(y=>y.classList.remove('active'));x.classList.add('active');selectedTone=x.textContent.trim();render()});generateButton.onclick=render;imageInput.onchange=e=>{const f=e.target.files[0];if(!f)return;imageUrl=URL.createObjectURL(f);const img=document.createElement('img');img.src=imageUrl;thumbBox.replaceChildren(img);render()};render();
  </script>
</main></body></html>
