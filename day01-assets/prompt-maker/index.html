<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>프롬프트 제조기</title>
<style>*{box-sizing:border-box}body{margin:0;background:#fff8ee;color:#302a24;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:760px;margin:auto;padding:28px 16px 60px}.hero{background:linear-gradient(135deg,#ff7738,#ffad55);color:#fff;border-radius:28px;padding:30px;box-shadow:0 16px 40px #b9592433}.tag{font-weight:800;opacity:.9}.hero h1{font-size:clamp(30px,6vw,48px);margin:8px 0}.hero p{font-size:18px;margin:0;line-height:1.55}.card{background:#fff;border:2px solid #f0dfcd;border-radius:24px;padding:22px;margin-top:18px}.field{margin:0 0 18px}label{display:block;font-size:18px;font-weight:850;margin-bottom:8px}input,textarea{width:100%;padding:15px;border:2px solid #decab5;border-radius:14px;font:inherit;font-size:16px}textarea{min-height:210px;line-height:1.55}.make,.copy,.reset{width:100%;border:0;border-radius:15px;padding:16px;font-size:18px;font-weight:850;cursor:pointer}.make{background:#f36d2f;color:#fff}.copy{background:#302a24;color:#fff}.reset{margin-top:10px;background:#eee2d5;color:#51463b}.result{display:none}.result.show{display:block}.result h2{margin-top:0}.help{color:#bc3f28;font-weight:750;min-height:24px}.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;background:#222;color:#fff;border-radius:99px;padding:12px 18px;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:520px){.hero,.card{padding:20px}.wrap{padding:12px 10px 50px}}</style></head>
<body><main class="wrap"><section class="hero"><div class="tag">왕초보도 세 칸이면 충분해요</div><h1>내 말 → 좋은 AI 요청문</h1><p>하고 싶은 말을 적으면 Claude에 바로 붙여넣을 수 있는 요청문으로 정리해 드립니다.</p></section><section class="card"><div class="field"><label for="what">1. 무엇을 만들까요?</label><input id="what" placeholder="예: 가족 주말 나들이 안내문"></div><div class="field"><label for="who">2. 누가 볼까요?</label><input id="who" placeholder="예: 어린아이와 외출하는 부모"></div><div class="field"><label for="must">3. 꼭 넣을 내용은?</label><input id="must" placeholder="예: 일시, 준비물, 비 오는 날 대안"></div><p class="help" id="help" role="alert"></p><button class="make" id="make">요청문 만들기</button></section><section class="card result" id="result"><h2>완성 요청문</h2><textarea id="output" readonly></textarea><button class="copy" id="copy">결과 복사</button><button class="reset" id="reset">처음부터</button></section></main><div class="toast" id="toast">복사했어요</div>
<script>const q=s=>document.querySelector(s),fields=[q('#what'),q('#who'),q('#must')];function toast(t){const el=q('#toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1700)}q('#make').onclick=()=>{const missing=fields.find(x=>!x.value.trim());if(missing){q('#help').textContent=`먼저 '${missing.previousElementSibling.textContent}' 칸을 채워 주세요.`;missing.focus();return}q('#help').textContent='';q('#output').value=`당신은 어려운 내용을 초보자도 이해하게 정리하는 친절한 기획자입니다.\n\n다음 결과를 만들어 주세요.\n- 만들 결과: ${fields[0].value.trim()}\n- 보는 사람: ${fields[1].value.trim()}\n- 꼭 넣을 내용: ${fields[2].value.trim()}\n\n조건:\n1. 전문용어 대신 쉬운 말을 사용해 주세요.\n2. 제목과 짧은 문단 또는 목록으로 보기 좋게 정리해 주세요.\n3. 바로 복사해 사용할 수 있는 완성본만 보여 주세요.\n4. 추가 확인 질문 없이 위 정보로 가장 실용적인 초안을 만들어 주세요.`;q('#result').classList.add('show');q('#result').scrollIntoView({behavior:'smooth'})};q('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(q('#output').value);toast('복사했어요. 새 Claude 채팅에 붙여넣으세요.')}catch{q('#output').select();toast('복사 권한이 없어 글을 선택했어요. 직접 복사하세요.')}};q('#reset').onclick=()=>{fields.forEach(x=>x.value='');q('#output').value='';q('#result').classList.remove('show');q('#help').textContent='';fields[0].focus()};</script></body></html>
