<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Claude 디자인 작업 화면 위치 설명도</title>
  <desc id="desc">왼쪽 채팅, 오른쪽 캔버스, 선택한 요소, 오른쪽 위 내보내기 위치를 보여 주는 설명도</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#171717"/><stop offset="1" stop-color="#080808"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1400" height="760" rx="32" fill="#0c0c0c"/>
  <rect x="36" y="34" width="1328" height="688" rx="24" fill="url(#bg)" stroke="#414141" stroke-width="2" filter="url(#shadow)"/>
  <rect x="36" y="34" width="1328" height="72" rx="24" fill="#202020"/>
  <rect x="36" y="82" width="1328" height="24" fill="#202020"/>
  <circle cx="70" cy="70" r="8" fill="#ff6a55"/><circle cx="96" cy="70" r="8" fill="#f4c95d"/><circle cx="122" cy="70" r="8" fill="#6ecb77"/>
  <text x="162" y="79" fill="#f6f1e8" font-family="Pretendard, sans-serif" font-size="22" font-weight="800">Day3 브랜드 론칭 키트</text>
  <rect x="1180" y="54" width="142" height="40" rx="12" fill="#f6f1e8"/>
  <text x="1251" y="80" text-anchor="middle" fill="#161616" font-family="Pretendard, sans-serif" font-size="16" font-weight="900">내보내기</text>

  <rect x="58" y="128" width="390" height="570" rx="18" fill="#161616" stroke="#353535"/>
  <text x="86" y="169" fill="#ff806b" font-family="Pretendard, sans-serif" font-size="15" font-weight="900">① 왼쪽 채팅</text>
  <text x="86" y="198" fill="#aaa" font-family="Pretendard, sans-serif" font-size="15">브리프와 사진을 첨부하고 부탁하는 곳</text>
  <rect x="82" y="229" width="340" height="96" rx="16" fill="#242424"/>
  <text x="104" y="260" fill="#e9e2d8" font-family="Pretendard, sans-serif" font-size="14">커버를 서로 다른 방향으로</text>
  <text x="104" y="286" fill="#e9e2d8" font-family="Pretendard, sans-serif" font-size="14">3안 만들어 주세요.</text>
  <rect x="82" y="344" width="156" height="46" rx="10" fill="#303030"/>
  <text x="160" y="373" text-anchor="middle" fill="#ddd" font-family="Pretendard, sans-serif" font-size="13">brief.txt</text>
  <rect x="250" y="344" width="172" height="46" rx="10" fill="#303030"/>
  <text x="336" y="373" text-anchor="middle" fill="#ddd" font-family="Pretendard, sans-serif" font-size="13">photo.png</text>
  <rect x="82" y="606" width="340" height="66" rx="16" fill="#272727" stroke="#565656"/>
  <text x="105" y="646" fill="#888" font-family="Pretendard, sans-serif" font-size="14">이 부분만 고쳐 주세요…</text>

  <rect x="470" y="128" width="872" height="570" rx="18" fill="#ece7dd"/>
  <text x="500" y="169" fill="#3c312b" font-family="Pretendard, sans-serif" font-size="15" font-weight="900">② 오른쪽 캔버스</text>
  <text x="500" y="198" fill="#766d67" font-family="Pretendard, sans-serif" font-size="15">실제 디자인을 보고 요소를 누르는 곳</text>
  <rect x="520" y="230" width="218" height="364" rx="8" fill="#ff654d"/>
  <text x="545" y="267" fill="#2b1712" font-family="Pretendard, sans-serif" font-size="12" font-weight="900">OPTION 01</text>
  <text x="545" y="365" fill="#19110e" font-family="Pretendard, sans-serif" font-size="34" font-weight="900">저녁을</text>
  <text x="545" y="407" fill="#19110e" font-family="Pretendard, sans-serif" font-size="34" font-weight="900">돌려받는</text>
  <text x="545" y="449" fill="#19110e" font-family="Pretendard, sans-serif" font-size="34" font-weight="900">20분</text>
  <rect x="764" y="230" width="218" height="364" rx="8" fill="#173d32"/>
  <text x="789" y="267" fill="#c8efdd" font-family="Pretendard, sans-serif" font-size="12" font-weight="900">OPTION 02</text>
  <rect x="789" y="335" width="158" height="68" rx="4" fill="none" stroke="#ffd76b" stroke-width="4" stroke-dasharray="9 7"/>
  <text x="806" y="378" fill="#fff7e9" font-family="Pretendard, sans-serif" font-size="29" font-weight="900">20분 리셋</text>
  <circle cx="970" cy="320" r="22" fill="#ffd76b"/>
  <text x="970" y="327" text-anchor="middle" fill="#1b1b1b" font-family="Pretendard, sans-serif" font-size="18" font-weight="900">③</text>
  <rect x="1008" y="230" width="218" height="364" rx="8" fill="#fffaf0" stroke="#2458d6" stroke-width="7"/>
  <text x="1033" y="267" fill="#2458d6" font-family="Pretendard, sans-serif" font-size="12" font-weight="900">OPTION 03</text>
  <text x="1033" y="345" fill="#171714" font-family="Pretendard, sans-serif" font-size="22" font-weight="900">모으기</text>
  <line x1="1033" y1="365" x2="1195" y2="365" stroke="#171714" stroke-width="2"/>
  <text x="1033" y="417" fill="#171714" font-family="Pretendard, sans-serif" font-size="22" font-weight="900">나누기</text>
  <line x1="1033" y1="437" x2="1195" y2="437" stroke="#171714" stroke-width="2"/>
  <text x="1033" y="489" fill="#171714" font-family="Pretendard, sans-serif" font-size="22" font-weight="900">멈추기</text>

  <rect x="742" y="617" width="358" height="54" rx="14" fill="#171717"/>
  <text x="921" y="650" text-anchor="middle" fill="#f4eee4" font-family="Pretendard, sans-serif" font-size="15" font-weight="800">③ 요소 선택 → 왼쪽 채팅에서 “이 부분만” 수정</text>
  <path d="M1160 617 C1215 590 1248 544 1254 478" fill="none" stroke="#ff654d" stroke-width="5" stroke-linecap="round"/>
  <path d="M1242 489 L1255 474 L1264 493" fill="none" stroke="#ff654d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1250 108 C1250 140 1251 161 1251 196" fill="none" stroke="#ff654d" stroke-width="4" stroke-dasharray="8 7"/>
  <text x="1250" y="215" text-anchor="middle" fill="#9a3b2e" font-family="Pretendard, sans-serif" font-size="14" font-weight="900">④ 저장할 때</text>

  <rect x="52" y="10" width="310" height="34" rx="17" fill="#ff654d"/>
  <text x="207" y="33" text-anchor="middle" fill="#fff" font-family="Pretendard, sans-serif" font-size="14" font-weight="900">실제 화면 캡처가 아닌 위치 설명도</text>
</svg>
