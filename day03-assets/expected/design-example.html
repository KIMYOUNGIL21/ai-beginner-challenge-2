<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Day 3 Design 완성 예시</title>
<style>*{box-sizing:border-box}body{margin:0;background:#dbeafe;font-family:Arial,"Apple SD Gothic Neo",sans-serif;color:#172554}.poster{position:relative;overflow:hidden;width:min(92vw,540px);min-height:900px;margin:30px auto;background:#fff;border-radius:32px;padding:52px 42px;box-shadow:0 22px 70px #17255433}.orb{position:absolute;border-radius:50%}.one{width:260px;height:260px;background:#e0f2fe;right:-90px;top:-70px}.two{width:130px;height:130px;background:#ffedd5;left:-55px;bottom:170px}.tag{position:relative;display:inline-block;background:#172554;color:white;padding:9px 15px;border-radius:99px;font-weight:700}.eyebrow{position:relative;color:#f97316;font-weight:800;margin-top:38px}.poster h1{position:relative;font-size:53px;line-height:1.12;letter-spacing:-2px;margin:12px 0 20px}.sub{position:relative;font-size:21px;line-height:1.6;margin:0 0 34px}.facts{position:relative;display:grid;gap:12px}.fact{display:flex;align-items:center;gap:15px;background:#f8fbff;border:2px solid #dbeafe;border-radius:18px;padding:16px}.num{display:grid;place-items:center;min-width:56px;height:56px;border-radius:16px;background:#172554;color:white;font-size:21px;font-weight:800}.fact b{font-size:20px}.fact span{display:block;color:#475569;margin-top:4px}.cta{position:relative;margin-top:36px;background:#f97316;color:white;border-radius:18px;padding:20px;text-align:center;font-size:21px;font-weight:800}.promise{position:relative;text-align:center;margin:22px 0 0;color:#475569}@media(max-width:570px){.poster{width:100%;min-height:100vh;margin:0;border-radius:0;padding:38px 26px}.poster h1{font-size:42px}}</style></head>
<body><main class="poster"><div class="orb one"></div><div class="orb two"></div><span class="tag">AI 첫걸음 7일</span><p class="eyebrow">왕초보를 위한 실습 과정</p><h1>AI, 이번에는<br>혼자 하지 마세요</h1><p class="sub">설치부터 첫 결과물까지<br>하루 한 단계씩 함께합니다.</p><section class="facts"><div class="fact"><div class="num">7일</div><div><b>짧게 끝까지</b><span>매일 하나의 주제만 배웁니다</span></div></div><div class="fact"><div class="num">90분</div><div><b>보고 바로 따라 하기</b><span>외우지 않고 화면으로 확인합니다</span></div></div><div class="fact"><div class="num">1개</div><div><b>눈에 보이는 결과물</b><span>매일 파일이나 링크가 남습니다</span></div></div></section><div class="cta">자세한 일정 확인하기 →</div><p class="promise">빠르게가 아니라, 혼자 다시 할 수 있을 때까지.</p></main></body></html>
