<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>생활 경험 브랜드 론칭 키트</title>
<style>
:root{--ink:#171714;--paper:#f4efe5;--coral:#ff5f46;--green:#183c31;--blue:#184ee8;--white:#fffdf8}*{box-sizing:border-box}body{margin:0;background:#111;color:var(--paper);font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif}.app{min-height:100vh}.bar{position:sticky;top:0;z-index:20;background:#111e;backdrop-filter:blur(12px);border-bottom:1px solid #ffffff20;padding:14px max(18px,calc((100vw - 1380px)/2));display:flex;gap:12px;align-items:center;justify-content:space-between}.logo{font-weight:950;letter-spacing:-.04em}.logo b{color:var(--coral)}.controls{display:flex;gap:7px;flex-wrap:wrap}.controls button{border:1px solid #ffffff25;background:#ffffff08;color:#bbb;border-radius:99px;padding:9px 13px;font:inherit;font-size:12px;cursor:pointer}.controls button.active{background:var(--paper);color:#111;font-weight:900}.wrap{width:min(1380px,calc(100% - 28px));margin:auto;padding:34px 0 80px}.intro{display:grid;grid-template-columns:1.4fr .6fr;gap:20px;align-items:end;margin-bottom:28px}.intro small{color:var(--coral);font-weight:900;letter-spacing:.13em}.intro h1{font-size:clamp(42px,7vw,88px);line-height:.91;letter-spacing:-.075em;margin:12px 0;white-space:pre-line;word-break:keep-all;overflow-wrap:anywhere}.intro p{color:#aaa;line-height:1.7;margin:0}.badge{border:1px solid #ffffff20;border-radius:20px;padding:18px;background:#ffffff08;font-size:13px;line-height:1.65}.view{display:none}.view.active{display:block;animation:up .25s ease}@keyframes up{from{opacity:.25;transform:translateY(6px)}to{opacity:1;transform:none}}.covers{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.cover,.slide,.story{position:relative;overflow:hidden;background:var(--paper);color:var(--ink);aspect-ratio:4/5;border-radius:7px}.cover .photo,.slide .photo,.story .photo{position:absolute;inset:0;background-size:cover;background-position:center}.shade{position:absolute;inset:0;background:linear-gradient(180deg,transparent 20%,#0d251dc7 100%)}.cover-content{position:absolute;inset:0;padding:8%;display:flex;flex-direction:column;justify-content:space-between}.cover .label,.slide .label{font-size:clamp(9px,1vw,13px);font-weight:950;letter-spacing:.12em}.cover h2{font-size:clamp(29px,4vw,58px);line-height:.95;letter-spacing:-.075em;margin:0}.cover p{font-size:clamp(11px,1.3vw,17px);line-height:1.5}.cover.photo-cover{color:#fff}.cover.type-cover{background:var(--coral)}.cover.type-cover h2{font-size:clamp(38px,5vw,72px)}.cover.system-cover{background:var(--white);border:8px solid var(--blue)}.list{display:grid;gap:10px;margin-top:auto}.list div{display:flex;align-items:center;gap:10px;border-top:2px solid;padding-top:9px;font-weight:850}.list i{font-style:normal;background:var(--blue);color:white;border-radius:99px;padding:4px 8px}.slides{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.slide{padding:8%;display:flex;flex-direction:column;justify-content:space-between}.slide h2{font-size:clamp(25px,3vw,47px);line-height:1;letter-spacing:-.065em;margin:10px 0}.slide p{font-size:clamp(11px,1.2vw,16px);line-height:1.55}.slide .num{position:absolute;right:7%;bottom:5%;font-size:11px;font-weight:900}.slide.dark{background:var(--green);color:white}.slide.coral{background:var(--coral)}.slide.blue{background:var(--blue);color:white}.slide.photo-card{color:white;padding:0}.slide.photo-card .inside{position:absolute;inset:0;padding:8%;display:flex;flex-direction:column;justify-content:space-between}.big-number{font-size:clamp(75px,12vw,170px);line-height:.75;font-weight:950;letter-spacing:-.1em}.steps{display:grid;gap:9px}.steps div{border:1px solid currentColor;border-radius:99px;padding:9px 12px;font-size:12px;font-weight:800}.timer{width:70%;aspect-ratio:1;border:14px solid;border-radius:50%;display:grid;place-items:center;margin:auto;font-size:clamp(30px,4vw,60px);font-weight:950}.check{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.check span{aspect-ratio:1;border:1px solid;border-radius:50%;display:grid;place-items:center;font-size:10px}.story-wrap{display:grid;grid-template-columns:minmax(250px,430px) 1fr;gap:30px;align-items:center}.story{aspect-ratio:9/16;border-radius:10px;color:#fff}.story .inside{position:absolute;inset:0;padding:9%;display:flex;flex-direction:column;justify-content:space-between}.story h2{font-size:clamp(38px,5vw,66px);line-height:.94;letter-spacing:-.07em}.story-copy h3{font-size:clamp(28px,4vw,55px);margin:0 0 12px;letter-spacing:-.05em}.story-copy p{color:#aaa;line-height:1.8}.spec{margin-top:22px;display:grid;gap:8px}.spec div{padding:13px 15px;border-radius:12px;background:#ffffff08;border:1px solid #ffffff15}.note{margin-top:18px;color:#999;font-size:12px}.career .accent{color:#a9c0ff}.career .cover.type-cover,.career .slide.coral{background:#cfd9ff}.career .cover.system-cover{border-color:#d6b174}.career .list i{background:#111}.career .slide.dark{background:#15213b}.career .slide.blue{background:#315bc7}
@media(max-width:900px){.intro{grid-template-columns:1fr}.covers{grid-template-columns:1fr 1fr}.slides{grid-template-columns:1fr 1fr}.story-wrap{grid-template-columns:1fr}.story{max-width:420px}.badge{display:none}}@media(max-width:560px){.bar{align-items:flex-start;flex-direction:column}.covers,.slides{grid-template-columns:1fr}.intro h1{font-size:50px}.cover h2,.slide h2{font-size:45px}.cover{max-height:none}.controls{overflow:auto;max-width:100%;flex-wrap:nowrap}.controls button{white-space:nowrap}}
</style></head><body><div class="app"><header class="bar"><div class="logo">CLAUDE <b>DESIGN LAB</b></div><div class="controls" id="persona" aria-label="사례 선택"><button class="active" data-persona="home" aria-pressed="true">육아·생활</button><button data-persona="career" aria-pressed="false">50대 두 번째 커리어</button></div><div class="controls" id="views" aria-label="결과 종류 선택"><button class="active" data-view="covers" aria-pressed="true">커버 3안</button><button data-view="carousel" aria-pressed="false">카드뉴스 7장</button><button data-view="story" aria-pressed="false">스토리 1장</button></div></header><main class="wrap" id="root"></main></div>
<script>
const D={home:{cls:'',eyebrow:'HOME RESET EDITORIAL',title:'저녁을 돌려받는\n20분 주방 리셋',desc:'육아와 살림의 실제 경험을 저장하고 싶은 콘텐츠로 바꾼 생활 브랜드 론칭 키트.',image:'../images/home-reset-editorial.png',promise:'완벽한 집이 아니라, 오늘 저녁 20분을 돌려드립니다.',steps:['식탁 위 물건을 한곳에','버릴 것·옮길 것·내일 쓸 것','타이머가 울리면 멈추기'],labels:['쌓이는 이유','바구니 3개','20분 순서','실패 방지','7일 체크','오늘 시작']},career:{cls:'career',eyebrow:'NEXT CHAPTER EDITORIAL',title:'직함 없이 다시 쓰는\n나의 30년 경력',desc:'은퇴를 앞둔 50대의 경험을 과장 없이 다음 일과 연결하는 두 번째 커리어 론칭 키트.',image:'../images/second-career-editorial.png',promise:'무엇을 새로 배울지보다, 이미 무엇을 해냈는지부터 찾습니다.',steps:['반복해서 부탁받은 일','해결해 본 어려운 문제','주말 2시간으로 작은 실험'],labels:['직함 지우기','경력 자산 3개','문제 해결 기록','작은 실험','7일 질문','오늘 시작']}};
let who='home',view='covers';
function cover(d,i){if(i===0)return `<article class="cover photo-cover"><div class="photo" style="background-image:url('${d.image}')"></div><div class="shade"></div><div class="cover-content"><span class="label">${d.eyebrow}</span><div><h2>${d.title.replace('\n','<br>')}</h2><p>${d.promise}</p></div></div></article>`;if(i===1)return `<article class="cover type-cover"><div class="cover-content"><span class="label">BIG TYPE / OPTION 02</span><div><div class="big-number">${who==='home'?'20':'30'}</div><h2>${who==='home'?'분이면<br>저녁이<br>돌아온다':'년은<br>사라지지<br>않는다'}</h2></div><p>${d.promise}</p></div></article>`;return `<article class="cover system-cover"><div class="cover-content"><span class="label">SYSTEM / OPTION 03</span><h2>${who==='home'?'다시 쌓이지 않는<br>주방 리셋 지도':'다음 일을 찾는<br>경력 자산 지도'}</h2><div class="list">${d.steps.map((x,n)=>`<div><i>0${n+1}</i>${x}</div>`).join('')}</div></div></article>`}
function carousel(d){const titles=who==='home'?['저녁을 돌려받는 20분','정리는 의지보다 동선','바구니는 딱 3개','20분 타이머를 켭니다','다시 쌓이는 물건은 따로','7일만 표시해 보세요','오늘은 식탁 한 칸부터']:['직함 없이 다시 쓰는 30년','경력은 회사에 남지 않습니다','내 자산은 이 3곳에','문제를 해결한 장면을 씁니다','주말 2시간만 시험합니다','7일 동안 질문합니다','오늘 한 줄부터 시작'];return `<div class="slides">${titles.map((t,i)=>{const c=['photo-card','coral','dark','','blue','','dark'][i];const body=i===0?`<div class="photo" style="background-image:url('${d.image}')"></div><div class="shade"></div><div class="inside"><span class="label">${d.eyebrow}</span><div><h2>${t}</h2><p>${d.promise}</p></div><span class="num">1 / 7</span></div>`:i===2?`<span class="label">THREE KEYS</span><h2>${t}</h2><div class="steps">${d.steps.map((x,n)=>`<div>0${n+1} · ${x}</div>`).join('')}</div><span class="num">${i+1} / 7</span>`:i===3?`<span class="label">${who==='home'?'20 MINUTE ACTION':'2 HOUR WEEKEND ACTION'}</span><h2>${t}</h2><div class="timer">${who==='home'?'20:00':'02:00'}</div><span class="num">${i+1} / 7</span>`:i===5?`<span class="label">7 DAY TRACK</span><h2>${t}</h2><div class="check">${[1,2,3,4,5,6,7].map(n=>`<span>${n}</span>`).join('')}</div><p>완벽하게보다 다시 시작할 수 있게.</p><span class="num">${i+1} / 7</span>`:`<span class="label">${d.labels[i-1]}</span><h2>${t}</h2><p>${i===6?'저장하고, 오늘 가능한 가장 작은 행동 하나만 해보세요.':'막연한 조언 대신 직접 해 본 순서와 기준을 한 장에 하나씩 보여 줍니다.'}</p><span class="num">${i+1} / 7</span>`;return `<article class="slide ${c}">${body}</article>`}).join('')}</div>`}
function render(){const d=D[who];root.className=`wrap${d.cls?' '+d.cls:''}`;root.innerHTML=`<section class="intro"><div><small>${d.eyebrow}</small><h1>${view==='covers'?'첫 화면에서\n멈춰 서게':'carousel'===view?'넘길수록\n해보고 싶게':'게시물로\n들어오고 싶게'}</h1><p>${d.desc}</p></div><div class="badge"><b>${view==='covers'?'하나의 주제, 완전히 다른 커버 3안':view==='carousel'?'표지 → 공감 → 방법 → 실행, 7장의 리듬':'같은 디자인 언어로 만든 9:16 예고편'}</b><br>버튼을 눌러 세 결과를 비교해 보세요. 이것이 Day 3에서 직접 만들 결과의 완성 방향입니다.</div></section><section class="view ${view==='covers'?'active':''}">${view==='covers'?`<div class="covers">${[0,1,2].map(i=>cover(d,i)).join('')}</div>`:''}</section><section class="view ${view==='carousel'?'active':''}">${view==='carousel'?carousel(d):''}</section><section class="view ${view==='story'?'active':''}">${view==='story'?`<div class="story-wrap"><article class="story"><div class="photo" style="background-image:url('${d.image}')"></div><div class="shade"></div><div class="inside"><span>${d.eyebrow}</span><div><h2>${d.title.replace('\n','<br>')}</h2><p>${d.promise}</p></div><b>새 게시물 보기 →</b></div></article><div class="story-copy"><h3>같은 주제,<br><span class="accent">다른 화면비.</span></h3><p>카드뉴스의 색·글꼴·사진을 그대로 이어 받아 세로 스토리 한 장으로 확장합니다. 새로 디자인하는 것이 아니라 이미 정한 디자인 규칙을 재사용하는 실습입니다.</p><div class="spec"><div>01 · 9:16 세로 프레임</div><div>02 · 제목은 두 줄 안쪽</div><div>03 · 행동 문장은 한 개만</div></div></div></div>`:''}</section><p class="note">※ 수업용 완성 방향 미리보기입니다. 사진 속 인물은 수업을 위해 생성한 가상 이미지이며 특정 실존 인물이 아닙니다.</p>`}
document.querySelectorAll('#persona button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#persona button').forEach(x=>{x.classList.remove('active');x.setAttribute('aria-pressed','false')});b.classList.add('active');b.setAttribute('aria-pressed','true');who=b.dataset.persona;render()});document.querySelectorAll('#views button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#views button').forEach(x=>{x.classList.remove('active');x.setAttribute('aria-pressed','false')});b.classList.add('active');b.setAttribute('aria-pressed','true');view=b.dataset.view;render()});render();
</script></body></html>
