<body><main class="page"><span class="label">PROJECT BRIEF</span><h1>AI 첫걸음 7일</h1><p class="lead">컴퓨터가 낯선 성인이 Claude로 결과물을 만들고, 혼자 다시 해보는 연습 과정입니다.</p><section class="grid"><article class="card"><h2>누구를 위해</h2><p>AI를 처음 접하는 40~60대 1인 사업자와 강사</p></article><article class="card"><h2>무엇을 만들까</h2><p>웹 도구, 콘텐츠, 카드뉴스, 짧은 영상</p></article><article class="card"><h2>어떻게 배울까</h2><p>보기 → 따라 하기 → 내 것으로 바꾸기 → 인증</p></article><article class="card"><h2>수업의 약속</h2><p>쉬운 말, 한 단계에 한 행동, 기본 과제는 API 키 없이</p></article></section><section class="facts"><div><b>7일</b>과정 기간</div><div><b>90분</b>하루 권장 시간</div><div><b>1개</b>매일 남기는 결과물</div></section><p class="note">빠르게가 아니라, 혼자 다시 할 수 있을 때까지.</p></main></body></html>
