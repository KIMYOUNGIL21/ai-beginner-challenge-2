<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>오늘의 15분 작전실</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:#071229;color:#f8fafc;font-family:system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}.shell{width:min(1180px,94vw);margin:32px auto;display:grid;grid-template-columns:360px 1fr;gap:22px}.panel,.stage{border:1px solid #ffffff1a;border-radius:28px;box-shadow:0 24px 70px #0008}.panel{padding:28px;background:#101e3d}.eyebrow{color:#ffb27d;font-size:13px;font-weight:900;letter-spacing:.16em}.panel h1{font-size:36px;line-height:1.05;margin:12px 0}.lead{color:#b9c7e8;line-height:1.65}.field{margin-top:18px}.field label{display:block;margin-bottom:7px;font-weight:800}.field input,.field select{width:100%;padding:14px;border:1px solid #8aa5e455;border-radius:13px;background:#071229;color:#fff;font:inherit}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.choice{padding:11px 5px;border:1px solid #8aa5e455;border-radius:12px;background:#0c1934;color:#c9d5f0;font:inherit;font-weight:800}.choice.active{border-color:#ff9f62;background:#ff9f6222;color:#ffd7bc}.make{width:100%;margin-top:22px;padding:15px;border:0;border-radius:14px;background:#ff9f62;color:#261004;font:inherit;font-weight:950;cursor:pointer}.error{min-height:22px;margin-top:10px;color:#ffc6a1;font-size:14px}.stage{position:relative;overflow:hidden;padding:34px;background:linear-gradient(135deg,#16367a,#102354 58%,#152044)}.stage:after{content:"";position:absolute;right:-90px;top:-110px;width:320px;height:320px;border-radius:50%;background:#48d7a833}.top{position:relative;z-index:1;display:flex;align-items:start;justify-content:space-between;gap:18px}.badge{display:inline-block;padding:8px 11px;border-radius:999px;background:#48d7a822;color:#83ffd7;font-size:12px;font-weight:900}.top h2{font-size:clamp(34px,6vw,72px);line-height:1;margin:16px 0 8px;max-width:700px}.summary{color:#cad7f7;font-size:18px}.clock{flex:0 0 auto;width:120px;height:120px;border:10px solid #ffffff20;border-top-color:#ff9f62;border-radius:50%;display:grid;place-items:center;font-size:30px;font-weight:950}.progress-wrap{position:relative;z-index:1;margin:30px 0}.progress-label{display:flex;justify-content:space-between;font-weight:850}.track{height:11px;margin-top:9px;background:#06132d;border-radius:99px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,#ff9f62,#48d7a8);transition:.35s}.cards{position:relative;z-index:1;display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.card{min-height:205px;padding:20px;border:1px solid #ffffff19;border-radius:20px;background:#071229aa;display:flex;flex-direction:column}.num{color:#ffb27d;font-weight:950}.card h3{font-size:22px;margin:12px 0 8px}.card p{color:#b9c7e8;line-height:1.55;margin:0 0 18px}.done{margin-top:auto;padding:11px;border:1px solid #ffffff2b;border-radius:12px;background:#ffffff0c;color:#fff;font:inherit;font-weight:800;cursor:pointer}.card.complete{border-color:#48d7a888;background:#0c3a3c99}.card.complete .done{background:#48d7a8;color:#04251d}.finish{position:relative;z-index:1;margin-top:18px;padding:17px;border-radius:16px;background:#ffffff0d;color:#d8e4ff}.finish strong{color:#ffbe92}@media(max-width:850px){.shell{grid-template-columns:1fr}.cards{grid-template-columns:1fr}.clock{width:92px;height:92px;font-size:24px}.top h2{font-size:39px}.card{min-height:0}}
  </style>
</head>
<body><main class="shell"><section class="panel"><div class="eyebrow">TODAY MISSION CONTROL</div><h1>오늘의<br>15분 작전실</h1><p class="lead">막막한 일 하나를 지금 움직일 수 있는 세 단계로 바꿉니다.</p><div class="field"><label for="task">지금 끝낼 일</label><input id="task" value="저녁 전에 거실 장난감 정리하기"></div><div class="field"><label for="minutes">쓸 수 있는 시간</label><select id="minutes"><option value="15">15분</option><option value="30">30분</option><option value="45">45분</option></select></div><div class="field"><label>지금 에너지</label><div class="choices"><button class="choice" data-energy="낮음">낮음</button><button class="choice active" data-energy="보통">보통</button><button class="choice" data-energy="높음">높음</button></div></div><button class="make" id="make">작전 만들기 →</button><div class="error" id="error"></div></section><section class="stage"><div class="top"><div><span class="badge">READY TO START</span><h2 id="mission">거실 장난감 정리</h2><div class="summary" id="summary">15분 · 에너지 보통 · 딱 세 단계만</div></div><div class="clock" id="clock">15:00</div></div><div class="progress-wrap"><div class="progress-label"><span>오늘의 진행률</span><span id="percent">0%</span></div><div class="track"><div class="bar" id="bar"></div></div></div><div class="cards" id="cards"></div><div class="finish">세 단계가 끝나면 오늘의 기록: <strong id="record">“나는 시작했고, 끝냈다.”</strong></div></section></main><script>
const $=s=>document.querySelector(s);const escapeHTML=value=>String(value).replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));let energy='보통';document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{document.querySelectorAll('.choice').forEach(x=>x.classList.remove('active'));b.classList.add('active');energy=b.dataset.energy});function build(){const raw=$('#task').value.trim(),minutes=Number($('#minutes').value);if(!raw){$('#error').textContent='먼저 지금 끝낼 일을 한 줄 적어 주세요.';$('#task').focus();return}$('#error').textContent='';const name=raw.replace(/하기$/,'').replace(/하세요$/,'');$('#mission').textContent=name;$('#summary').textContent=`${minutes}분 · 에너지 ${energy} · 딱 세 단계만`;$('#clock').textContent=`${minutes}:00`;const prep=Math.max(2,Math.round(minutes*.2)),finish=Math.max(2,Math.round(minutes*.2)),focus=minutes-prep-finish;const plans=[['준비',`${prep}분`,`${raw}에 필요한 것만 한곳에 모으고 방해되는 물건 하나를 치우세요.`],['집중',`${focus}분`,`${raw}만 합니다. 새 일이 보여도 지금은 메모만 하세요.`],['마무리',`${finish}분`,`눈에 보이는 한 구역을 끝내고, 다음에 시작할 위치를 한 줄 남기세요.`]];$('#cards').innerHTML=plans.map((p,i)=>`<article class="card"><span class="num">0${i+1} · ${p[1]}</span><h3>${p[0]}</h3><p>${escapeHTML(p[2])}</p><button class="done">완료 표시</button></article>`).join('');document.querySelectorAll('.done').forEach(btn=>btn.onclick=()=>{btn.parentElement.classList.toggle('complete');btn.textContent=btn.parentElement.classList.contains('complete')?'완료 ✓':'완료 표시';progress()});progress();$('#record').textContent=`“${name}, 오늘 여기까지 해냈다.”`}function progress(){const all=[...document.querySelectorAll('.card')],n=all.filter(x=>x.classList.contains('complete')).length,p=Math.round(n/all.length*100)||0;$('#percent').textContent=p+'%';$('#bar').style.width=p+'%'}$('#make').onclick=build;build();
</script></body></html>
