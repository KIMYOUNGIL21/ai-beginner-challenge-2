<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>오늘의 첫 행동</title>
  <style>
    body{margin:0;background:#eff6ff;color:#172554;font-family:system-ui,sans-serif}.card{max-width:520px;margin:10vh auto;padding:32px;background:white;border-radius:24px;box-shadow:0 12px 35px #1e3a8a22}h1{font-size:2rem}p{line-height:1.7}input,button{box-sizing:border-box;width:100%;font:inherit;padding:15px;border-radius:12px}input{border:2px solid #93c5fd}button{margin-top:12px;border:0;background:#2563eb;color:white;font-weight:700}.result{margin-top:20px;padding:18px;background:#dbeafe;border-radius:12px;min-height:26px}
  </style>
</head>
<body><main class="card"><h1>오늘의 첫 행동</h1><p>오늘 꼭 끝낼 일 하나만 적어 보세요.</p><input id="task" value="강의안 첫 페이지 쓰기" aria-label="오늘 할 일"><button id="start">첫 행동 정하기</button><div id="result" class="result">버튼을 누르면 가장 작은 첫 행동이 나옵니다.</div></main><script>document.querySelector('#start').onclick=()=>{const v=document.querySelector('#task').value.trim();document.querySelector('#result').textContent=v?`지금 5분 동안 “${v}”의 첫 부분만 시작하세요.`:'먼저 오늘 할 일을 한 줄 적어 주세요.'}</script></body>
</html>
