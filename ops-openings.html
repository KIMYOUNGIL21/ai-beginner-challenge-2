<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>그밤PD 오프닝 멘트</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <style>
    :root {
      --primary: #0f0f0f; --canvas: #ffffff; --ink: #0f0f0f;
      --hairline: #e4e4e4; --soft: #f5f5f5;
      --lime: #d8f26e; --lilac: #dcc8f5; --cream: #f6efe3; --mint: #cdeedd;
      --pink: #f8d8e8; --coral: #ffa98f; --navy: #252a5c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--canvas); color: var(--ink);
      font-family: "Pretendard Variable", Pretendard, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      font-size: 16px; line-height: 1.6; word-break: keep-all;
    }
    header { max-width: 720px; margin: 0 auto; padding: 40px 20px 8px; }
    h1 { font-size: 30px; font-weight: 340; letter-spacing: -0.02em; margin: 0 0 8px; }
    .note { font-size: 14px; color: #555; margin: 0; }
    main { max-width: 720px; margin: 0 auto; padding: 20px 20px 80px; display: flex; flex-direction: column; gap: 20px; }
    .card { border-radius: 20px; padding: 24px 24px 20px; background: var(--soft); position: relative; }
    .card.inverse { color: #fff; }
    .card-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
    .day-chip {
      font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 11px; font-weight: 600;
      letter-spacing: 0.08em; padding: 3px 10px; border-radius: 6px;
      background: rgba(15,15,15,0.08); white-space: nowrap;
    }
    .card.inverse .day-chip { background: rgba(255,255,255,0.18); }
    .card-title { font-size: 17px; font-weight: 700; }
    .msg { white-space: pre-line; font-size: 15.5px; }
    .copy {
      position: absolute; top: 18px; right: 18px;
      border: none; border-radius: 50px; cursor: pointer;
      background: var(--primary); color: #fff;
      font: inherit; font-size: 13px; font-weight: 600; padding: 7px 16px 8px;
    }
    .copy:active { transform: scale(0.96); }
    .copy.done { background: #14ae5c; }
    .card.inverse .copy { background: #fff; color: var(--primary); }
    .card.inverse .copy.done { background: var(--lime); }
    footer { max-width: 720px; margin: 0 auto; padding: 0 20px 48px; font-size: 12px; color: #888; }
    @media (max-width: 480px) {
      .copy { position: static; margin-top: 14px; width: 100%; padding: 12px; }
      .card { padding: 20px 18px 18px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>그밤PD 오프닝 멘트</h1>
    <p class="note">복사 버튼을 누르면 통째로 복사됩니다. 카톡에 붙여넣고 필요하면 말투만 다듬으세요.</p>
  </header>
  <main id="list"></main>
  <footer>운영용 페이지 · AI 왕초보 챌린지 2기 · 그밤PD</footer>

<script>
const MSGS = [
{day:"개강", title:"준비하는 날", bg:"var(--soft)", inv:false, text:`[개강] 🔔 왕초보 챌린지 2기, 오늘 시작합니다

오늘은 수업이 아니라 준비하는 날이에요.
설치하고, 폴더 하나 만들고, hello.txt라는 파일 하나 만들면 끝.

"파일 하나 만든 게 뭐라고?" 싶으시겠지만 —
AI가 내 컴퓨터에 뭔가를 만드는 첫 경험입니다.
7일 뒤 영상 한 편도 오늘 이 한 걸음에서 시작해요.

막히면 5분 이상 붙잡지 마시고, 화면 찍어서 바로 올려주세요.
여기 1,000명 중에 같은 데서 막힌 분 반드시 있습니다.

교재는 공지 링크에서! 끝나면 초록불 화면으로 첫 인증(✅📸💬) 🌱`},

{day:"DAY 1", title:"아티팩트", bg:"var(--lime)", inv:false, text:`[Day 1] ☀️ 오늘의 주인공: 아티팩트

지금까지 AI는 "말로 답해주는 친구"였죠.
아티팩트는 그 친구가 말 대신 물건을 만들어 건네주는 기능입니다.
"이런 거 만들어줘" 하면 대화 옆에 진짜로 눌러볼 수 있는 화면이 생겨요.

오늘이 중요한 이유 — 오늘부로 여러분은
"AI한테 물어보는 사람"에서 "AI한테 만들게 시키는 사람"이 됩니다.
이게 7일 전체의 출발점이에요.

오늘 만들 것: 내 콘텐츠 성과 대시보드 + 인스타 캡션 공장 + 유튜브 제목 연구소.
코드 한 줄 몰라도 됩니다. 교재 문장을 그대로 붙여넣기만 하세요.

교재 Day 1 열고 출발! 끝나면 30초 인증(✅📸💬) 🙌`},

{day:"DAY 2", title:"프로젝트", bg:"var(--lilac)", inv:false, text:`[Day 2] 🗂️ 오늘의 주인공: 프로젝트

어제 아티팩트 만들 때 불편한 거 없으셨어요?
새 채팅을 열 때마다 내가 누군지, 뭘 하는 사람인지
처음부터 다시 설명해야 했죠.

프로젝트는 나를 기억하는 단골 가게를 만드는 기능입니다.
내 자료와 규칙을 한 번 넣어두면, 새 채팅을 열어도
"아 그 20분 저녁 정리 하시는 분!" 하고 알아봅니다.

오늘 만들 것: 나를 기억하는 LIFE BRAND 운영본부 한 화면.
오늘의 하이라이트는 "새 채팅 기억 시험" — 소개를 안 썼는데
AI가 나를 알고 있는 순간, 소름 돋습니다.

교재 Day 2에서 만나요. 인증(✅📸💬)도 잊지 마시고!`},

{day:"DAY 3", title:"디자인", bg:"var(--cream)", inv:false, text:`[Day 3] 🎨 오늘의 주인공: 디자인

"디자인은 감각 있는 사람이나 하는 거지" 하셨던 분,
오늘이 그 생각 깨지는 날입니다.

클로드의 디자인 기능은 말로 시키는 디자이너예요.
왼쪽에서 말로 부탁하면 오른쪽 캔버스에 실제 디자인이 생기고,
마음에 안 드는 한 부분만 콕 집어서 고칠 수도 있습니다.

오늘 만들 것: 커버 3종 + 카드뉴스 7장 + 스토리 1장 = 브랜드 론칭 키트.
인스타 하려고 미리캔버스 붙잡고 밤새던 일,
오늘부로 다르게 하게 됩니다.

교재 Day 3 시작! 제일 마음에 드는 커버로 인증(✅📸💬) 🎉`},

{day:"DAY 4", title:"코워크", bg:"var(--mint)", inv:false, text:`[Day 4] 📁 오늘의 주인공: 코워크

여기저기 흩어진 메모, 다들 있으시죠?
수첩에 하나, 카톡 나에게 보내기에 하나, 메모장에 하나…

코워크는 폴더를 통째로 맡기는 기능입니다.
"이 폴더 안의 메모들 읽고 정리해줘" 하면
여러 파일을 읽고, 비교하고, 완성된 파일로 만들어 돌려줘요.

오늘 만들 것: 메모 3장 → 가족 여행 브리핑북
(버튼 눌리는 진짜 웹페이지 + PDF).

오늘부터는 AI가 내 컴퓨터의 파일을 직접 만지기 시작합니다.
그래서 "어느 폴더까지 보여줄지" 정하는 법도 같이 배워요.
안전이 실력입니다.

교재 Day 4 고고! 브리핑북 첫 화면으로 인증(✅📸💬) 🧳`},

{day:"DAY 5", title:"Code", bg:"var(--pink)", inv:false, text:`[Day 5] 🛠️ 오늘의 주인공: Code

드디어 Code입니다. 이름만 보고 겁내지 마세요 —
코드를 배우는 날이 아니라, 코드를 시키는 날입니다.

지금까지는 클로드 안에서 놀았다면,
Code는 내 컴퓨터에 진짜 파일이 생기는 작업실이에요.
말로 설명하면 → 뭘 바꿀지 계획을 보여주고 →
내가 승인하면 → 파일이 만들어집니다.

오늘 만들 것: 할 일·시간·에너지를 넣으면
3단계 작전을 짜주는 「오늘의 작전실」.
버튼 누르면 진행률이 0%→100%로 차오르는,
여러분 인생 첫 웹 도구입니다.

교재 Day 5로! 완성 화면 인증(✅📸💬) 기다릴게요 💪`},

{day:"DAY 6", title:"Skill", bg:"var(--coral)", inv:false, text:`[Day 6] 🔁 오늘의 주인공: Skill

어제까지 잘 만들었는데, 한 가지 아쉬운 게 있어요.
잘 만든 그 과정을 다음에 또 하려면
처음부터 다시 해야 한다는 것.

Skill은 레시피 저장 기능입니다.
한 번 잘된 작업 순서를 저장해두면,
다음부터는 /이름 한 번에 그대로 반복돼요.
백종원 레시피 저장해두고 꺼내 쓰는 것과 똑같습니다.

오늘 만들 것: /shorts-brief 한 방에 나오는 쇼츠 5컷 주문서.
그리고 이 주문서, 내일 그대로 들고 가서 진짜 영상이 됩니다.
오늘이 내일의 재료예요.

교재 Day 6! 완성 주문서로 인증(✅📸💬) 📋`},

{day:"DAY 7", title:"내 인생 첫 AI 쇼츠", bg:"var(--navy)", inv:true, text:`[Day 7] 🎬 마지막 날: 내 인생 첫 AI 쇼츠

6일 동안 배운 걸 세어볼까요?
만들게 시키기(1일) → 기억시키기(2일) → 디자인(3일)
→ 파일 맡기기(4일) → 도구 만들기(5일) → 반복시키기(6일).

오늘은 이걸 전부 연결해서 끝을 봅니다.
주제 하나 → 대본 → AI 성우 목소리 → 영상 5컷 → 자막까지,
세로 쇼츠 MP4 한 편이 여러분 컴퓨터에서 나옵니다.

일주일 전의 나는 hello.txt 하나 만들고 신기해했는데,
오늘의 나는 영상 한 편을 만듭니다. 이게 7일의 거리예요.

교재 Day 7, 마지막 출발!
오늘 인증은 캡처 말고 완성 영상 그 자체입니다 🏆`}
];

const list = document.getElementById("list");
MSGS.forEach(m => {
  const card = document.createElement("section");
  card.className = "card" + (m.inv ? " inverse" : "");
  card.style.background = m.bg;
  card.innerHTML =
    '<div class="card-head"><span class="day-chip">' + m.day + '</span>' +
    '<span class="card-title">' + m.title + '</span></div>' +
    '<div class="msg"></div>' +
    '<button class="copy" type="button">복사</button>';
  card.querySelector(".msg").textContent = m.text;
  const btn = card.querySelector(".copy");
  btn.addEventListener("click", async () => {
    let ok = false;
    try { await navigator.clipboard.writeText(m.text); ok = true; } catch (e) {}
    if (!ok) {
      const ta = document.createElement("textarea");
      ta.value = m.text; document.body.appendChild(ta); ta.select();
      try { ok = document.execCommand("copy"); } catch (e) {}
      ta.remove();
    }
    btn.textContent = ok ? "복사됨 ✓" : "길게 눌러 복사하세요";
    btn.classList.toggle("done", ok);
    setTimeout(() => { btn.textContent = "복사"; btn.classList.remove("done"); }, 1800);
  });
  list.appendChild(card);
});
</script>
</body>
</html>
