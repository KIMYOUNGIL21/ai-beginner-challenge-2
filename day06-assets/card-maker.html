<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Day 6 무설치 카드 생성기</title><style>
*{box-sizing:border-box}body{margin:0;padding:22px;background:#eef2ff;color:#111827;font-family:system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}.wrap{max-width:1100px;margin:auto;display:grid;grid-template-columns:minmax(280px,380px) 1fr;gap:24px}.panel,.card{border-radius:24px}.panel{padding:24px;background:#fff}h1{font-size:25px;margin-top:0}.help{font-size:14px;line-height:1.55;color:#475569}label{display:block;font-weight:750;margin-top:14px}input,textarea,button{width:100%;font:inherit;border-radius:11px}input,textarea{margin-top:6px;padding:11px;border:2px solid #c7d2fe}textarea{min-height:70px}button{margin-top:14px;padding:13px;border:0;background:#4f46e5;color:#fff;font-weight:800}.secondary{background:#334155}.card{align-self:start;padding:42px;background:#111827;color:#fff;box-shadow:0 18px 50px #312e8160}.day{color:#a5b4fc;font-weight:800}.card h2{font-size:clamp(30px,6vw,54px);line-height:1.12;margin:12px 0 30px}.box{padding:18px;margin:14px 0;border-radius:18px;background:#ffffff12}.box b{display:block;color:#c7d2fe;margin-bottom:8px}.box p{font-size:20px;line-height:1.55;margin:0;white-space:pre-wrap}.name{text-align:right;color:#d1d5db;margin-top:24px}@media(max-width:760px){.wrap{grid-template-columns:1fr}.panel,.card{padding:22px}}
</style></head><body><main class="wrap"><section class="panel"><h1>인증 카드 입력</h1><p class="help">설치와 Python 없이 작동합니다. 다섯 칸을 모두 내 내용으로 바꾸세요.</p><label>닉네임<input id="nickname" value="내닉네임"></label><label>카드 제목<input id="title" value="나의 첫 Skill 인증"></label><label>오늘 만든 것<textarea id="result">브라우저에서 무설치 인증 카드를 만들었습니다.</textarea></label><label>오늘 배운 것<textarea id="learned">Skill이 같은 입력과 검수 순서를 반복하는 방법을 배웠습니다.</textarea></label><label>다음에 할 것<textarea id="next">내 실제 결과로 한 번 더 만들기</textarea></label><button id="preview">미리보기 반영</button><button id="download" class="secondary">proof-card.html 다운로드</button></section><section class="card" id="card"><div class="day">Day 6 COMPLETE</div><h2 id="v-title"></h2><div class="box"><b>오늘 만든 것</b><p id="v-result"></p></div><div class="box"><b>오늘 배운 것</b><p id="v-learned"></p></div><div class="box"><b>다음에 할 것</b><p id="v-next"></p></div><p class="name" id="v-nickname"></p></section></main><script>
const ids=['nickname','title','result','learned','next'];const vals=()=>Object.fromEntries(ids.map(x=>[x,document.getElementById(x).value.trim()]));function render(){const v=vals();for(const x of ids)if(!v[x]){alert('빈칸 없이 다섯 항목을 입력해 주세요.');document.getElementById(x).focus();return false}document.getElementById('v-title').textContent=v.title;document.getElementById('v-result').textContent=v.result;document.getElementById('v-learned').textContent=v.learned;document.getElementById('v-next').textContent=v.next;document.getElementById('v-nickname').textContent='@'+v.nickname;return true}preview.onclick=render;download.onclick=()=>{if(!render())return;const css=document.querySelector('style').textContent,card=document.getElementById('card').outerHTML,html='<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>'+css+'body{display:block}.card{max-width:720px;margin:30px auto}</style>'+card+'</html>',a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download='proof-card.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};render();
</script></body></html>
